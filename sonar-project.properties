sonar.projectKey=multi-tenant-task-manager
sonar.projectName=Multi-Tenant Task Management System
sonar.host.url=http://localhost:9000
# Generate a token in SonarQube (My Account > Security) and export it as an
# environment variable instead of hardcoding it here:
#   export SONAR_TOKEN=your_token_here
sonar.token=${env.SONAR_TOKEN}

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.source=17
sonar.sourceEncoding=UTF-8
